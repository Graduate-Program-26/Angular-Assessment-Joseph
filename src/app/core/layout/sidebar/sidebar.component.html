<nav aria-label="Main navigation">
  <ul class="flex flex-col gap-0.5 px-3">
    @for (item of navItems; track item.route) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-[var(--tui-background-elevation-2)] text-white"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[var(--tui-text-secondary)] hover:text-white hover:bg-[var(--tui-background-elevation-1)] transition-all duration-150 font-medium text-sm group"
        >
          <tui-icon
            [icon]="item.icon"
            class="text-lg shrink-0 group-hover:scale-110 transition-transform duration-150"
          ></tui-icon>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>

<div class="mt-auto px-3 pt-4 border-t border-[var(--tui-border-normal)]">
  <p class="text-xs text-[var(--tui-text-tertiary)] px-3 mb-2 font-semibold uppercase tracking-wider">My Playlists</p>
  <div class="flex flex-col gap-0.5">
    <!-- Playlist items will be rendered here from IndexedDB in a future step -->
    <div class="px-3 py-2 text-xs text-[var(--tui-text-secondary)] italic">No playlists yet</div>
  </div>
</div>
