<div class="flex flex-col gap-10 pb-12 animate-in fade-in duration-700">
  <header>
    <h1 class="text-4xl md:text-5xl font-black text-var(--tui-text-primary) tracking-tighter">Explore</h1>
    <p class="text-[var(--tui-text-secondary)]">Discover the latest hits and rising stars.</p>
  </header>

  @if (isLoading()) {
    <div class="flex items-center justify-center py-40">
      <tui-loader [loading]="true" size="xl"></tui-loader>
    </div>
  } @else {
    <!-- Trending Tracks Section -->
    <section class="flex flex-col gap-6">
      <h2 class="text-2xl font-bold text-var(--tui-text-primary)">Global Charts</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-2">
        @for (track of trendingTracks(); track track.id; let i = $index) {
          <app-track-card [track]="track" [index]="i + 1" [showIndex]="true"></app-track-card>
        }
      </div>
    </section>

    <!-- Popular Artists Section -->
    <section class="flex flex-col gap-6">
      <h2 class="text-2xl font-bold text-var(--tui-text-primary)">Top Artists</h2>
      <div class="flex gap-8 overflow-x-auto no-scrollbar pb-4 -mx-4 px-4">
        @for (artist of topArtists(); track artist.id) {
          <div class="min-w-36">
            <app-artist-card [artist]="artist"></app-artist-card>
          </div>
        }
      </div>
    </section>

    <!-- Top Albums Section -->
    <section class="flex flex-col gap-6">
      <h2 class="text-2xl font-bold text-var(--tui-text-primary)">Top Albums</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
        @for (album of topAlbums(); track album.id) {
          <app-album-card [album]="album"></app-album-card>
        }
      </div>
    </section>
  }
</div>
