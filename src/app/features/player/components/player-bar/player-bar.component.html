<!-- ── TOP PROGRESS BAR ── -->
<div class="absolute top-0 left-0 right-0 h-1 group/progress cursor-pointer overflow-visible z-50">
  <!-- Track Background -->
  <div class="absolute inset-0 bg-var(--tui-background-neutral-2) group-hover/progress:h-1.5 transition-all"></div>

  <!-- Fill -->
  <div
    class="absolute top-0 left-0 h-full bg-linear-to-r from-purple-500 to-pink-500 group-hover/progress:h-1.5 transition-all"
    [style.width.%]="progressPercent()"></div>

  <!-- Handle (Ball) -->
  <div
    class="absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-var(--tui-background-neutral-2) rounded-full shadow-lg opacity-0 group-hover/progress:opacity-100 transition-opacity pointer-events-none"
    [style.left.%]="progressPercent()" style="margin-left: -6px;"></div>

  <!-- Hidden Input for Interaction -->
  <input type="range" [value]="store.currentTime()" [max]="store.duration()" (input)="onSeek($event)"
    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
</div>

<!-- ── TIMESTAMPS: Top Left & Right (under border) ── -->
<div
  class="absolute top-2 left-6 text-[10px] text-var(--tui-text-action) font-medium tabular-nums pointer-events-none select-none">
  {{ store.currentTime() | duration }}
</div>
<div
  class="absolute top-2 right-6 text-[10px] text-(--tui-text-secondary) font-medium tabular-nums pointer-events-none select-none">
  {{ store.duration() | duration }}
</div>

<!-- ── LEFT SECTION: Track Info ── -->
<div class="flex items-center gap-3 mt-3 w-1/3 min-w-0">
  <div
    class="w-10 h-10 md:w-12 md:h-12 bg-(--tui-background-elevation-1) rounded-md shrink-0 flex items-center justify-center border border-(--tui-border-normal) overflow-hidden">
    @if (store.currentTrack()?.album?.cover_small) {
    <img [src]="store.currentTrack()?.album?.cover_small" alt="Album Art" class="w-full h-full object-cover">
    } @else {
    <tui-icon icon="@tui.music" class="text-(--tui-text-secondary) text-sm"></tui-icon>
    }
  </div>

  <div class="flex flex-col min-w-0 flex-1">
    <span class="text-sm font-semibold truncate text-var(--tui-text-action) leading-tight">
      {{ store.currentTrack()?.title || 'Select a track' }}
    </span>
    <span class="text-xs text-(--tui-text-secondary) truncate leading-tight">
      {{ store.currentTrack()?.artist?.name || 'Artist Name' }}
    </span>
  </div>
</div>

<!-- ── CENTER SECTION: Playback Controls ── -->
<div class="flex flex-col items-center justify-center mt-3 flex-1 max-w-[40%] gap-1">
  <div class="flex items-center gap-3 md:gap-5">
    <!-- Shuffle Toggle -->
    <button (click)="toggleShuffle()" class="transition-colors" [class.text-purple-500]="store.shuffled()"
      [class.text-(--tui-text-secondary)]="!store.shuffled()" [title]="store.shuffled() ? 'Shuffle On' : 'Shuffle Off'">
      <tui-icon icon="@tui.shuffle" class="text-base"></tui-icon>
    </button>

    <button (click)="playPrevious()"
      class="text-(--tui-text-secondary) hover:text-var(--tui-text-action) transition-colors">
      <tui-icon icon="@tui.step-back" class="text-lg"></tui-icon>
    </button>

    <button (click)="togglePlay()"
      class="w-10 h-10 flex items-center justify-center rounded-full bg-linear-to-tr from-purple-500 to-pink-500 text-var(--tui-text-action) hover:scale-105 transition-transform shadow-lg shadow-purple-500/20 shrink-0">
      <tui-icon [icon]="store.isPlaying() ? '@tui.pause' : '@tui.play'" class="text-base translate-x-px"></tui-icon>
    </button>

    <button (click)="playNext()"
      class="text-(--tui-text-secondary) hover:text-var(--tui-text-action) transition-colors">
      <tui-icon icon="@tui.step-forward" class="text-lg"></tui-icon>
    </button>

    <!-- Repeat Toggle -->
    <button (click)="toggleRepeat()" class="transition-colors relative"
      [class.text-purple-500]="store.repeatMode() !== 'off'"
      [class.text-(--tui-text-secondary)]="store.repeatMode() === 'off'" [title]="'Repeat: ' + store.repeatMode()">
      <tui-icon [icon]="store.repeatMode() === 'one' ? '@tui.repeat-1' : '@tui.repeat'" class="text-base"></tui-icon>
      @if (store.repeatMode() !== 'off') {
      <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 bg-purple-500 rounded-full"></div>
      }
    </button>
  </div>
</div>

<!-- ── RIGHT SECTION: Volume & Extras ── -->
<div class="flex items-center justify-end gap-3 mt-3 w-1/3">
  <div class="hidden md:flex items-center gap-3">
    <tui-icon (click)="toggleMute()"
      [icon]="store.muted() ? '@tui.volume-x' : store.volume() === 0 ? '@tui.volume-x' : '@tui.volume-2'"
      class="text-(--tui-text-secondary) text-sm shrink-0"></tui-icon>
    <input type="range" [value]="store.volume()" max="100" (input)="onVolumeChange($event)"
      class="w-24 h-1 bg-(--tui-background-elevation-1) rounded-full appearance-none cursor-pointer accent-white">
  </div>

  <button (click)="playerUi.toggleQueue()"
    class="flex xl:hidden items-center justify-center w-8 h-8 rounded-full text-(--tui-text-secondary) hover:text-var(--tui-text-action) hover:bg-(--tui-background-elevation-1) transition-all shrink-0"
    aria-label="Open queue">
    <tui-icon icon="@tui.list-music" class="text-base"></tui-icon>
  </button>
</div>
